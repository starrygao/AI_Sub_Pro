name: Release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Release dry-run validation
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install Python dependencies
        run: |
          bash tools/release/setup_environment.sh
          echo "$PWD/.release-venv/bin" >> "$GITHUB_PATH"

      - name: Build frontend CSS
        run: npm run build:css

      - name: Run test suite
        run: AI_SUB_PRO_DATA_DIR="$(mktemp -d)" python3 -m pytest -q

      - name: Run packaging script checks
        run: python3 -m pytest -q tests/test_packaging_scripts.py

      - name: Verify bilingual release notes exist
        run: test -s docs/RELEASE_NOTES.md && test -s docs/RELEASE_NOTES.zh-CN.md

      - name: Prepare release metadata dry-run
        run: python3 tools/release/prepare_release.py --dist-dir dist --output dist/release-size-report.json --checksum-dir dist --allow-empty

      - name: Show checksum and size report
        run: |
          find dist -maxdepth 1 -name '*.sha256' -print -exec cat {} \;
          cat dist/release-size-report.json

  publish:
    name: Build and upload GitHub release
    needs: validate
    runs-on: macos-15
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install Python dependencies
        run: |
          bash tools/release/setup_environment.sh
          echo "$PWD/.release-venv/bin" >> "$GITHUB_PATH"

      - name: Install macOS media dependencies
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix ffmpeg-full)/bin/ffmpeg" -hide_banner -filters | grep " subtitles "

      - name: Build macOS DMG
        run: bash make_dmg.sh

      - name: Verify packaged startup and credential migration
        run: |
          VERSION=$(python3 -c 'from app.version import APP_VERSION; print(APP_VERSION)')
          python3 tools/release/smoke_test.py --bundle 'dist/AI Sub Pro.app' --version "$VERSION" --output dist/release-smoke-report.json

      - name: Prepare release metadata
        run: python3 tools/release/prepare_release.py --dist-dir dist --output dist/release-size-report.json --checksum-dir dist

      - name: Upload GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" --draft --verify-tag --title "$TAG_NAME" --notes "Automated draft release for $TAG_NAME"
          find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.sha256' -o -name 'release-size-report.json' \) -print0 \
            | xargs -0 gh release upload "$TAG_NAME" --clobber
